# Render Blueprint: бэкенд AuditRank + база PostgreSQL.
# Деплой: Render → New → Blueprint → подключить этот репозиторий.
services:
  - type: web
    name: auditrank-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev обязательно: NODE_ENV=production иначе пропускает devDependencies (typescript),
    # а без tsc сборка падает. Сами зависимости рантайма (express, pg) лежат в dependencies.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # DATABASE_URL подставляется автоматически из базы ниже.
      - key: DATABASE_URL
        fromDatabase:
          name: auditrank-db
          property: connectionString
      # CORS_ORIGIN задаётся вручную в дашборде = адрес фронта на Vercel.
      - key: CORS_ORIGIN
        sync: false
      # APP_URL = адрес фронта на Vercel — на него ведёт ссылка сброса пароля из письма.
      - key: APP_URL
        sync: false
      # Ключ Resend для отправки писем (создать на resend.com). Пока пуст — ссылка пишется в лог.
      - key: RESEND_API_KEY
        sync: false
      # Адрес отправителя писем (подтверждённый в Resend домен; для теста — onboarding@resend.dev).
      - key: MAIL_FROM
        sync: false

databases:
  - name: auditrank-db
    plan: free
